<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Slope-Ready Meal Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800&family=Albert+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,700;8..144,800&display=swap">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f4f5c">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>

<div class="field-bg" aria-hidden="true"></div>
<header class="ctx">
  <div class="mark-word"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2 20 9 8l4 6 3-4 6 10z"/><path d="m7.5 10.6 1.5 1.4 1.6-1.6" stroke-linecap="round"/></svg>Slope-Ready</div>
  <span class="sync" id="sync">Saved on this device</span>
  <div class="right"><div class="who-switch"><div class="seg" role="group" aria-label="Show plan for" id="whoSeg"></div></div><label class="style-pick"><span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Style</span><select id="uiSel"><option value="aurora">Aurora</option><option value="graphite">Graphite health</option><option value="swiss">Swiss precision</option><option value="perf">Dark performance</option><option value="tonal">Tonal soft</option></select></label></div>
</header>

<main class="wrap" id="app">
  <section class="tab" id="tab-today"></section>
  <section class="tab" id="tab-meals" hidden></section>
  <section class="tab" id="tab-swap" hidden></section>
  <section class="tab" id="tab-grocery" hidden></section>
  <section class="tab" id="tab-train" hidden></section>
  <section class="tab" id="tab-targets" hidden></section>
</main>

<dialog id="picker" aria-labelledby="pickTitle"><div class="pk-head"><h3 id="pickTitle">Choose a dish</h3><button type="button" class="btn sm" data-closepick>Close</button></div><div class="pk-grid" id="pickGrid"></div></dialog>
<nav class="dock" id="tabs" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="today" aria-selected="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>Today</button>
  <button role="tab" data-tab="meals" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"/></svg>Meals</button>
  <button role="tab" data-tab="swap" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg>Swap</button>
  <button role="tab" data-tab="grocery" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Shop</button>
  <button role="tab" data-tab="train" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M2 20 9 8l4 6 3-4 6 10z"/></svg>Train</button>
  <button role="tab" data-tab="targets" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-4 4-5.5 7-5.5s6 1.5 7 5.5"/></svg>You</button>
</nav>

<script src="src/data.js"></script>
<script src="src/app.js"></script>
</body>
</html>
